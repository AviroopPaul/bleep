[package]
name = "bleep"
version = "0.4.0"
description = "A little droid that lives on your Mac"
authors = ["Aviroop Paul"]
edition = "2024"

[lib]
name = "bleep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# "bleep (dev)": its own data folder, Keychain items and bundle id. See src/flavor.rs.
dev = []

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
dirs = "6"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
axum = "0.8"
tokio-util = "0.7"
chrono = "0.4"
iana-time-zone = "0.1"
rand = "0.9"
hex = "0.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }
rusqlite = { version = "0.42", features = ["bundled"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# rmcp's HTTP client type, for its OAuth-aware MCP transport.
reqwest013 = { package = "reqwest", version = "0.13", default-features = false }
tauri-plugin-opener = "2"
base64 = "0.22"
bytes = "1"
regex = "1"
tokio-tungstenite = "0.30.0"
toml_edit = "0.25.19"
tauri-plugin-updater = "2"
# Wake word: mic capture, resampling, on-device speech to text (Moonshine via ONNX Runtime).
cpal = "0.16"
rubato = "0.16"
transcribe-rs = { version = "0.3", features = ["onnx"] }
# transcribe-rs 0.3.12 does not build against ort rc.15; keep the version it was written for.
ort = { version = "=2.0.0-rc.12", default-features = false }
sha2 = "0.10"
ndarray = "0.17"
tauri-plugin-notification = "2"
pdf-extract = "0.12.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
