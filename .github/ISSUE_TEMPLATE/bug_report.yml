name: Bug report
description: Something in bleep does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the chat
        2. Ask "..."
        3. ...
  - type: input
    id: version
    attributes:
      label: bleep version
      description: Settings, About.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.4, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model mode
      options:
        - Claude Code
        - API key
        - Local (Ollama or LM Studio)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From ~/.bleep/logs. Remove any mail content or personal data first.
      render: text
